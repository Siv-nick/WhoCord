#
# WhoCord pinned dependency lock.
#
# This file pins the direct requirements from requirements.txt to
# specific versions. It is what CI and the Dockerfile install from,
# so a build failure caused by an upstream release is caught here
# rather than mid-investigation.
#
# Regenerate after changing requirements.txt:
#
#     pip install pip-tools
#     pip-compile --output-file=requirements.lock requirements.txt
#
# To add wheel hashes for a fully hermetic install:
#
#     pip-compile --generate-hashes \
#         --output-file=requirements.lock \
#         requirements.txt
#
# The pinned versions below are known-good as of the last manual
# audit. Transitive dependencies are not listed — they float within
# the bounds the direct deps declare. Run pip-compile to promote them
# to pinned entries.
#

